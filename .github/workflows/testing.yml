name: Code Quality & Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plastani_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, sqlite, pdo_sqlite, pdo_mysql
        coverage: xdebug

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Copy environment file
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Run migrations
      run: php artisan migrate --force
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: plastani_test
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Run PHPUnit tests
      run: php artisan test
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'

    - name: Run static analysis (PHPStan)
      run: vendor/bin/phpstan analyse
      continue-on-error: true

    - name: Run code format check (Pint)
      run: vendor/bin/pint --test
      continue-on-error: true

    - name: Generate code coverage
      run: php artisan test --coverage --coverage-html=coverage
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/index.html
        fail_ci_if_error: false
      continue-on-error: true
